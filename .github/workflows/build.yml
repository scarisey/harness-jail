name: "Build and test flake"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_harness_jail:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NIXPKGS_ALLOW_BROKEN: "1"
      NIXPKGS_ALLOW_UNFREE: "1"
      NIXPKGS_ALLOW_INSECURE: "1"
      NIX_CONFIG: |
        experimental-features = nix-command flakes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: mount Nix store on larger partition
        # on the Linux runner `/` doesn't have enough space, but there's a `/mnt` which does.
        if: runner.os == 'Linux'
        run: |
          sudo mkdir /nix /mnt/nix
          sudo mount --bind /mnt/nix /nix
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Configure Cachix
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cachix/cachix-action@v17
        with:
          name: scarisey-public
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Check formatting
        run: |
          nix fmt -- --check .
      - name: Build packages
        run: |
          nix build --impure --accept-flake-config .#packages.x86_64-linux.copilot
          nix build --impure --accept-flake-config .#packages.x86_64-linux.headroom
          nix build --impure --accept-flake-config .#packages.x86_64-linux.litellm
      - name: Evaluate checks
        if: github.event_name == 'pull_request'
        run: |
          nix flake check --impure --accept-flake-config --no-build
      - name: Run checks
        if: github.event_name != 'pull_request'
        run: |
          nix flake check --impure --accept-flake-config
